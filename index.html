<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>先輩パワーバランス診断</title>
<style>
:root{--bg:#f3efe6;--paper:#fffdf8;--ink:#24231f;--muted:#77736a;--line:#ddd6c8;--senior:#765744;--junior:#315d69;--accent:#bd5e3f;--soft:#eee8dd;--warn:#9c3f31}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#f8f5ef,#eee7da);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;line-height:1.55}.wrap{width:min(760px,calc(100% - 28px));margin:24px auto 60px}.head{display:flex;gap:12px;align-items:center;margin-bottom:16px}.logo{width:48px;height:48px;border-radius:15px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800}h1{font-size:clamp(23px,6vw,32px);margin:0;letter-spacing:-.04em}.sub{font-size:13px;color:var(--muted);margin:2px 0 0}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(60,45,30,.08)}.progbox{padding:18px 20px 0}.proghead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}.prog{height:7px;background:var(--soft);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ink);width:0;transition:.2s}.stage{min-height:500px;padding:27px 20px 22px;display:flex;flex-direction:column}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.08em}.q{font-size:clamp(24px,6vw,36px);line-height:1.2;letter-spacing:-.04em;margin:7px 0 8px}.hint{font-size:14px;color:var(--muted);margin:0 0 20px}.choices,.checks{display:grid;gap:10px}.choice,.check{border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px 15px;color:var(--ink)}button.choice{width:100%;text-align:left;font:inherit;cursor:pointer}.choice.sel{border:2px solid var(--ink);padding:13px 14px;background:#f2ede4}.choice strong,.check strong{display:block}.choice small,.check small{display:block;color:var(--muted);margin-top:3px}.check{display:flex;gap:10px;align-items:flex-start}.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink)}.interim{margin-top:18px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 13px}.interimTop,.miniLabels{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}.interimTop strong{color:var(--ink)}.miniTrack,.track{background:linear-gradient(90deg,var(--senior) 0 50%,var(--junior) 50%);position:relative;border-radius:99px}.miniTrack{height:9px;margin:8px 0 6px}.miniNeedle,.needle{position:absolute;background:#fff;border:2px solid var(--ink);transform:translateX(-50%);border-radius:4px;transition:.25s}.miniNeedle{width:4px;height:18px;top:-5px}.nav{display:flex;gap:10px;margin-top:auto;padding-top:24px}.nav button,.restart{min-height:48px;padding:0 17px;border:1px solid var(--line);border-radius:13px;background:#fff;font:inherit;font-weight:700;cursor:pointer}.nav .next{margin-left:auto;background:var(--ink);color:#fff;border-color:var(--ink)}.nav .next:disabled{opacity:.3;cursor:not-allowed}.result{display:none;padding:22px 20px 26px}.result.show{display:block}.hide{display:none!important}.verdict{background:var(--ink);color:#fff;border-radius:18px;padding:22px}.vk{font-size:12px;font-weight:800;opacity:.68;letter-spacing:.08em}.vt{font-size:clamp(29px,8vw,46px);font-weight:850;line-height:1.1;letter-spacing:-.05em;margin:6px 0}.vd{font-size:14px;opacity:.82}.warning{margin-top:14px;border:2px solid #b94d39;background:#fff0e8;border-radius:16px;padding:15px}.warning strong{display:block;color:#852f22;font-size:17px}.warning p{font-size:13px;color:#704039;margin:5px 0 0}.balance{margin:22px 0}.labels,.pct{display:flex;justify-content:space-between}.labels{font-size:12px;color:var(--muted);margin-bottom:7px}.track{height:18px}.needle{width:4px;height:30px;top:-6px}.pct{font-weight:800;margin-top:8px}.metrics{display:grid;grid-template-columns:1fr;gap:9px}.metric{border:1px solid var(--line);border-radius:15px;padding:13px}.metric span{font-size:12px;color:var(--muted)}.metric b{display:block;font-size:27px;letter-spacing:-.04em}.section{margin-top:22px}.section h2{font-size:17px;margin:0 0 10px}.entry{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 12px;background:var(--soft);border-radius:12px;margin-bottom:8px}.entry small{display:block;color:var(--muted);margin-top:2px}.plus{color:var(--senior);font-weight:850}.minus{color:var(--junior);font-weight:850}.risk{border:1px solid #dcbab3;background:#fff8f5;border-radius:14px;padding:13px;margin-bottom:8px}.risk strong{color:var(--warn)}.risk small{display:block;color:var(--muted);margin-top:3px}.method{border-top:1px solid var(--line);padding-top:14px;margin-top:22px;color:var(--muted);font-size:12px}@media(min-width:640px){.stage,.result{padding-left:30px;padding-right:30px}.progbox{padding-left:30px;padding-right:30px}.metrics{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main class="wrap">
<div class="head"><div class="logo">力</div><div><h1>先輩パワーバランス診断</h1></div></div>
<div class="card">
<div class="progbox" id="progbox"><div class="proghead"><span id="stepLabel"></span><span id="stepCount"></span></div><div class="prog"><i id="bar"></i></div></div>
<section class="stage" id="stage"><div id="qa"></div><div class="interim" id="interim" hidden><div class="interimTop"><span>暫定・表面上のパワー</span><strong id="interimText"></strong></div><div class="miniTrack"><i class="miniNeedle" id="miniNeedle"></i></div><div class="miniLabels"><span>先輩側</span><span id="miniPct"></span><span>後輩側</span></div></div><div class="nav"><button id="back">戻る</button><button id="next" class="next">次へ</button></div></section>
<section class="result" id="result"></section>
</div>
</main>
<script>
(function(){
var empty=function(){return{role:null,season:null,weather:null,place:null,age:null,closeness:null,authority:null,obligations:[],refusal:null,past:null,pastTypes:[],current:null,money:null,paid:null,threats:[],danger:null,pressure:null,evidence:null,witness:null}};
var s=empty(),step=0;
var qs=[
['role','あなたは先輩ですか？','最初に立場を確認します。','c',[['yes','はい、私が先輩です'],['no','いいえ、相手が先輩です']]],
['season','いまの季節は？','季節は小さな状況補正として使います。','c',[['spring','春'],['summer','夏'],['autumn','秋'],['winter','冬']]],
['weather','その日の天気・気候は？','天候は場の余裕や圧力感を微調整します。','c',[['sunny','晴れ'],['cloudy','曇り'],['rain','雨'],['hot','猛暑'],['cold','厳寒'],['storm','荒天']]],
['place','どんな場面ですか？','職場や公式の場では先輩性や裁量が表面に出やすくなります。','c',[['private','私的な場'],['work','通常の職場'],['meeting','会議・公式の場'],['study','勉強会・研究の場'],['event','会食・行事'],['online','メッセージ・オンライン']]],
['age','先輩は後輩より何歳上ですか？','年次差を表面上の先輩パワーに加えます。','c',[['0','同年齢'],['1','1歳'],['2','2歳'],['3','3〜5歳'],['6','6歳以上']]],
['closeness','相手との親しさはどの程度ですか？','関係の近さを小さな補正として使います。不当要求の重さを打ち消すことはありません。','c',[['0','ほぼ面識だけ'],['1','仕事上の付き合い'],['2','雑談や私的なやり取りもある'],['3','かなり親しい'],['4','家族同然・非常に近い']]],
['authority','職場上の裁量は、先輩側にどれくらいありますか？','割当・評価・情報・調整などへの実際の影響力を見ます。','c',[['0','ほぼない'],['1','少しある'],['2','明確にある'],['3','かなり強い']]],
['obligations','先輩側への「義理・恩義」に当てはまるものは？','該当するほど、まず表面上は先輩側が強く計算されます。','m',[['none','特になし','該当なし'],['study','勉強会','学ぶ機会や場を通じた世話・助力'],['research','研究','研究・実践上の助力や知見'],['wedding','結婚式','司会など人生行事での大きな役割'],['celebration','お祝い','祝い事・贈答・節目での世話']]],
['refusal','その先輩の要求をどの程度断れますか？','義理・恩義とは別に、実際の拒否余地を確認します。','c',[['0','ほとんど断れない'],['1','かなり断りにくい'],['2','状況次第'],['3','普通に断れる'],['4','強く拒否できる']]],
['past','過去に、義務のない不当・無茶な要求を受けたことがありますか？','今回とは別の過去分です。現在分と合算します。','c',[['none','特にない'],['once','1〜2回ある'],['repeat','繰り返しある'],['habit','かなり常態化している']]],
['pastTypes','過去の不当・無茶な要求は、どんな内容でしたか？','複数選べます。','m',[['none','特になし・該当なし','過去分として加算しない'],['money','金銭要求','支払い・おごり・金銭の提供を求める等'],['researchFee','研究資料等への過大な対価要求','研究資料・データ・知見等の提供に対し、相場や関係性から見て過大な金銭・見返りを求める'],['mailThreat','職場内郵便・文書等での脅迫','職場内郵便、文書、メモ等を用いて害や不利益を示唆する'],['otherThreat','その他の脅しを伴う要求','口頭・メッセージ等で不利益を示唆して従わせようとする'],['bug','虫を食べる等','摂食・身体に関わる無茶な要求'],['humiliation','屈辱的な要求','恥をかく行為・罰ゲーム等'],['work','仕事上の不利益を伴う要求','担当・評価・業務上の立場に関わるもの']]],
['current','現在の場面で、不当・無茶な要求はありますか？','ここからは現在分を記録します。','c',[['none','特にない'],['some','ある'],['strong','かなり強い要求がある']]],
['money','金銭の要求をされましたか？','お金を出す・払う・おごる等を含みます。','c',[['no','いいえ'],['ask','要求された'],['strong','強く要求された']]],
['paid','実際に金銭を渡しましたか？','金銭要求がない場合は「いいえ」を選んでください。','c',[['no','いいえ'],['yes','はい、支払った・渡した']]],
['threats','脅し・不利益の示唆はありましたか？','複数選べます。','m',[['none','なし','脅し・不利益の示唆はない'],['reputation','名誉・評判','悪く言う、恥をかかせる等'],['relation','人間関係・排除','仲間外れ、関係を切る等'],['work','仕事上の不利益','業務・担当・評価等で不利益を示唆'],['property','財産への害','物や金銭への不利益を示唆'],['physical','身体・自由への害','身体への害、拘束等を示唆']]],
['danger','身体的・危険な要求はありましたか？','虫を食べる等、身体に関わる義務のない要求も含めます。','c',[['none','なし'],['gross','不快・屈辱的な要求'],['bug','虫を食べる等の摂食要求'],['risk','けが・体調悪化のおそれがある要求'],['force','暴力・身体的な強制があった']]],
['pressure','拒否した場合の圧力はどの程度でしたか？','断る自由が実質的に狭いかを見ます。','c',[['0','圧力なし'],['1','軽い圧力'],['2','かなり断りにくい'],['3','強い威圧'],['4','事実上、押し切られる']]],
['evidence','やり取りを示す記録はありますか？','記録があるほど先輩側の説明責任を重く計算します。','c',[['0','特にない'],['1','自分のメモ'],['2','メッセージ・メール'],['3','録音・明確な記録']]],
['witness','第三者は知っていますか？','最後の質問です。','c',[['0','二人だけ'],['1','目撃・認知した人がいる'],['2','複数人が把握している'],['3','管理職等も把握している']]]
];
function $(id){return document.getElementById(id)}
function N(v){return Number(v||0)}
function multiSet(id){var a=[].slice.call(document.querySelectorAll('#qa input:checked')).map(function(x){return x.value});var active=document.activeElement;if(a.indexOf('none')>=0&&a.length>1){if(active&&active.value==='none'){[].slice.call(document.querySelectorAll('#qa input')).forEach(function(x){if(x.value!=='none')x.checked=false})}else{var n=document.querySelector('#qa input[value="none"]');if(n)n.checked=false}}s[id]=[].slice.call(document.querySelectorAll('#qa input:checked')).map(function(x){return x.value})}
function surface(){var p=56;p+=({0:0,1:2,2:5,3:8,6:11}[s.age]||0)+({0:0,1:1,2:2,3:4,4:6}[s.closeness]||0)+N(s.authority)*5+({private:0,work:3,meeting:5,study:2,event:1,online:0}[s.place]||0);var w={study:4,research:5,wedding:8,celebration:4};s.obligations.filter(function(x){return x!=='none'}).forEach(function(x){p+=w[x]||0});p-=N(s.refusal)*2;return Math.max(58,Math.min(84,p))}
function interim(){if(!s.role){$('interim').hidden=true;return}$('interim').hidden=false;var p=surface();$('miniNeedle').style.left=p+'%';$('miniPct').textContent=Math.round(p)+'% / '+Math.round(100-p)+'%';$('interimText').textContent=p>=72?'先輩側がかなり優位':p>=64?'先輩側が優位':'先輩側がやや優位'}
function roleQuestion(q){if(s.role!=='yes')return[q[1],q[2]];var id=q[0],m={
age:['あなたは相手より何歳上ですか？','年次差を表面上のあなたのパワーに加えます。'],
authority:['あなたには、相手に影響する職場上の裁量がどれくらいありますか？','割当・評価・情報・調整などへの実際の影響力を見ます。'],
obligations:['あなたが相手に対して行った「義理・恩義」に当てはまるものは？','該当するほど、まず表面上はあなた側が強く計算されます。'],
refusal:['相手は、あなたの要求をどの程度断れますか？','義理・恩義とは別に、相手側の実際の拒否余地を確認します。'],
past:['過去に、相手へ義務のない不当・無茶な要求をしたことがありますか？','今回とは別の過去分です。現在分と合算します。'],
pastTypes:['過去に相手へ行った不当・無茶な要求は、どんな内容でしたか？','複数選べます。'],
current:['現在、相手に不当・無茶な要求をしていますか？','ここからは現在分を記録します。'],
money:['相手に金銭を要求しましたか？','お金を出させる・払わせる・おごらせる等を含みます。'],
paid:['実際に相手から金銭を受け取りましたか？','金銭要求がない場合は「いいえ」を選んでください。'],
threats:['相手に脅し・不利益の示唆をしましたか？','複数選べます。'],
danger:['相手に身体的・危険な要求をしましたか？','虫を食べる等、身体に関わる義務のない要求も含めます。'],
pressure:['相手が拒否した場合、どの程度の圧力をかけましたか？','相手が断る自由をどの程度狭めたかを見ます。'],
evidence:['相手とのやり取りを示す記録はありますか？','記録があるほど、あなた側の説明責任を重く計算します。'],
witness:['あなたと相手のやり取りを第三者は知っていますか？','最後の質問です。']
};return m[id]||[q[1],q[2]]}
function render(){var q=qs[step],id=q[0],rq=roleQuestion(q),html='<div class="eyebrow">POWER CHECK</div><h2 class="q">'+rq[0]+'</h2><p class="hint">'+rq[1]+'</p>';$('stepLabel').textContent='QUESTION '+(step+1);$('stepCount').textContent=(step+1)+' / '+qs.length;$('bar').style.width=((step+1)/qs.length*100)+'%';$('back').style.visibility=step?'visible':'hidden';$('next').textContent=step===qs.length-1?'判定する':'次へ';if(q[3]==='c'){html+='<div class="choices">';q[4].forEach(function(o){html+='<button class="choice '+(s[id]===o[0]?'sel':'')+'" data-v="'+o[0]+'"><strong>'+o[1]+'</strong>'+(o[2]?'<small>'+o[2]+'</small>':'')+'</button>'});html+='</div>'}else{html+='<div class="checks">';q[4].forEach(function(o){html+='<label class="check"><input type="checkbox" value="'+o[0]+'" '+(s[id].indexOf(o[0])>=0?'checked':'')+'><span><strong>'+o[1]+'</strong><small>'+o[2]+'</small></span></label>'});html+='</div>'}$('qa').innerHTML=html;if(q[3]==='c'){[].slice.call(document.querySelectorAll('.choice')).forEach(function(b){b.onclick=function(){s[id]=b.dataset.v;render()}})}else{[].slice.call(document.querySelectorAll('#qa input')).forEach(function(c){c.onchange=function(){multiSet(id);interim();valid()}})}interim();valid()}
function valid(){var q=qs[step];$('next').disabled=q[3]==='c'?!s[q[0]]:s[q[0]].length===0}
$('next').onclick=function(){if(step<qs.length-1){step++;render();scrollTo({top:0,behavior:'smooth'})}else result()};$('back').onclick=function(){if(step){step--;render()}};
function calc(){var season={spring:0,summer:1,autumn:0,winter:.5}[s.season]||0,weather={sunny:0,cloudy:.4,rain:1,hot:1.6,cold:1.2,storm:2}[s.weather]||0,age={0:0,1:3,2:5,3:8,6:12}[s.age]||0,close={0:0,1:1.5,2:3,3:5,4:7}[s.closeness]||0,pa={private:0,work:5,meeting:7,study:3,event:1,online:0}[s.place]||0,ow={study:6,research:7,wedding:11,celebration:5},obl=0;s.obligations.filter(function(x){return x!=='none'}).forEach(function(x){obl+=ow[x]||0});var ref=N(s.refusal)*5,surf=40+age+close+N(s.authority)*7+pa+obl-season-weather-ref*.15;var pf={none:0,once:13,repeat:34,habit:62}[s.past]||0,pw={money:16,researchFee:26,mailThreat:34,otherThreat:28,bug:30,humiliation:14,work:22},pt=0;s.pastTypes.filter(function(x){return x!=='none'}).forEach(function(x){pt+=pw[x]||0});var past=pf+pt;if(s.past==='repeat')past+=pt*.24;if(s.past==='habit')past+=pt*.45+18;var cur={none:0,some:12,strong:28}[s.current]||0;cur+=s.money==='strong'?22:s.money==='ask'?11:0;cur+=s.paid==='yes'?10:0;var tw={reputation:15,relation:13,work:24,property:21,physical:31};s.threats.filter(function(x){return x!=='none'}).forEach(function(x){cur+=tw[x]||0});cur+=({none:0,gross:14,bug:30,risk:34,force:45}[s.danger]||0)+N(s.pressure)*9;if(s.money!=='no'&&s.threats.some(function(x){return x!=='none'}))cur+=24;if(s.danger!=='none'&&s.threats.some(function(x){return x!=='none'}))cur+=18;var total=past+cur,back=total*1.05;if(past>0&&cur>0)back+=22+Math.min(34,total*.12);back+=N(s.evidence)*16+N(s.witness)*13;if(N(s.evidence)>=2&&past>25)back+=18;if(N(s.witness)>=2&&cur>25)back+=15;var senior=surf+cur*.14-back*.78,junior=34+ref+back*.6+N(s.evidence)*4+N(s.witness)*4,share=Math.max(4,Math.min(96,50+(senior-junior)*.48)),trap=s.role==='yes';if(trap){back=Math.max(back,220);share=Math.min(share,6)}return{surf:surf,past:past,cur:cur,total:total,back:back,share:share,jshare:100-share,trap:trap,obl:obl}}
function names(){return s.role==='yes'?['あなた（先輩）','相手（後輩）']:['相手（先輩）','あなた（後輩）']}
function warning(c){if(c.trap)return '<div class="warning"><strong>⚠ 虫を食え、などの不当な要求を過去に行った可能性があります</strong><p>回答内容にかかわらず、先輩側には潜在的な要求履歴リスクがあるものとして最終判定へ強く反映されています。</p></div>';if(s.pastTypes.indexOf('bug')>=0||s.danger==='bug')return '<div class="warning"><strong>⚠ 虫を食え、などの不当な要求の履歴が検出されました</strong><p>過去分と現在分を合算し、先輩側への反作用として強く反映しています。</p></div>';return ''}
function legal(){var r=[],th=s.threats.some(function(x){return x!=='none'}),strong=N(s.pressure)>=2;if(th)r.push(['脅迫罪の可能性','刑法222条','生命・身体・自由・名誉・財産への害を告知して脅迫した場合、犯罪成立が問題となり得ます。']);if((th||s.danger==='force')&&strong&&(s.money!=='no'||s.danger!=='none'||s.current!=='none'))r.push(['強要罪の可能性','刑法223条','脅迫または暴行を用いて義務のないことを行わせる等の場合、犯罪成立が問題となり得ます。']);if(s.paid==='yes'&&s.money!=='no'&&th)r.push(['恐喝罪の可能性','刑法249条','恐喝して財物を交付させた等の場合、犯罪成立が問題となり得ます。']);if(s.danger==='force')r.push(['暴行罪の可能性','刑法208条','身体に対する有形力の行使がある場合、犯罪成立が問題となり得ます。']);return r}
function result(){var c=calc(),n=names(),risks=legal(),head=c.trap?'先輩側、圧倒的不利':c.share>=70?'先輩側が強い':c.share>=55?'先輩側がやや優位':c.share>=45?'ほぼ互角':c.share>=30?'後輩側が逆転':'先輩側の立場が大きく崩れている';var desc=c.trap?'途中までの表面上の優位とは逆に、最終判定では先輩側が圧倒的不利です。義理・恩義よりも潜在的な不当要求履歴とその反作用を重く扱っています。':c.share<45?'義理・恩義による表面上の先輩優位を、過去と現在の不当要求の累積が上回りました。':'現時点では表面上の先輩優位が残っています。';var h='<div class="verdict"><div class="vk">FINAL POWER BALANCE</div><div class="vt">'+head+'</div><div class="vd">'+desc+'</div></div>'+warning(c)+'<div class="balance"><div class="labels"><span>'+n[0]+'</span><span>'+n[1]+'</span></div><div class="track"><i class="needle" style="left:'+c.share+'%"></i></div><div class="pct"><span>'+Math.round(c.share)+'%</span><span>'+Math.round(c.jshare)+'%</span></div></div><div class="metrics"><div class="metric"><span>表面上の先輩パワー</span><b>'+Math.round(c.surf)+'</b><small>年次・裁量・義理・恩義</small></div><div class="metric"><span>過去＋現在の要求負債</span><b>'+Math.round(c.total)+'</b><small>過去 '+Math.round(c.past)+' ＋ 現在 '+Math.round(c.cur)+'</small></div><div class="metric"><span>先輩側への反作用</span><b>'+Math.round(c.back)+'</b><small>累積・証拠・第三者</small></div></div>';var om={study:['勉強会','+6'],research:['研究','+7'],wedding:['結婚式','+11'],celebration:['お祝い','+5']};h+='<div class="section"><h2>義理・恩義の帳簿</h2>';var os=s.obligations.filter(function(x){return x!=='none'});h+=os.length?os.map(function(x){return '<div class="entry"><div><strong>'+om[x][0]+'</strong><small>表面上の先輩優位へ加算</small></div><div class="plus">'+om[x][1]+'</div></div>'}).join(''):'<div class="entry"><div><strong>加算なし</strong></div><div>±0</div></div>';h+='</div><div class="section"><h2>先輩側の立場を削っているもの</h2>';if(c.past)h+='<div class="entry"><div><strong>過去の不当要求</strong><small>頻度と種類を合算</small></div><div class="minus">-'+Math.round(c.past)+'</div></div>';if(c.cur)h+='<div class="entry"><div><strong>現在の不当要求</strong><small>金銭・脅し・危険要求・圧力を合算</small></div><div class="minus">-'+Math.round(c.cur)+'</div></div>';if(c.past&&c.cur)h+='<div class="entry"><div><strong>過去 × 現在の累積</strong><small>同じ関係での蓄積を追加反作用に変換</small></div><div class="minus">増幅</div></div>';if(c.trap)h+='<div class="entry"><div><strong>先輩本人として回答</strong><small>潜在的な過去要求リスクを強制反映</small></div><div class="minus">上限6%</div></div>';h+='</div><div class="section"><h2>刑事責任につながり得る論点</h2>';h+=risks.length?risks.map(function(x){return '<div class="risk"><strong>'+x[0]+'</strong><small>'+x[1]+' ｜ '+x[2]+'</small></div>'}).join(''):'<div class="risk"><strong style="color:#456b58">現在の入力から強い刑事論点は抽出されませんでした</strong><small>個別事案の犯罪成立や法的責任を判定するものではありません。</small></div>';h+='</div><div class="method">この診断は人間関係をあえて「強弱」に圧縮した試作モデルです。義理・恩義は表面上の先輩優位へ加点し、不当要求は過去分と現在分を合算して先輩側への反作用として計算します。刑法表示は成立を断定するものではありません。</div><button class="restart" id="restart">最初から診断する</button>';$('stage').classList.add('hide');$('progbox').classList.add('hide');$('result').classList.add('show');$('result').innerHTML=h;$('restart').onclick=function(){s=empty();step=0;$('result').classList.remove('show');$('stage').classList.remove('hide');$('progbox').classList.remove('hide');render();scrollTo({top:0,behavior:'smooth'})}}
render();
